# Scheduled FPL ingestion workflow.
#
# Runs daily at 08:00 UTC — after FPL typically processes overnight gameweek
# updates. workflow_dispatch allows manual triggering for ad-hoc runs or
# testing without waiting for the cron schedule.
#
# STORAGE LIMITATION — READ BEFORE DEPLOYING:
# GitHub Actions runners are ephemeral. The SQLite database is written
# to the runner's local disk and is destroyed when the job completes.
# Each scheduled run starts from an empty database.
# To persist data across runs, push the database to external storage
# (e.g. Azure Blob, S3) and restore it at job start.
#
# This workflow demonstrates operational scheduling and audit artifact
# generation. To make it operationally useful for season-long data
# accumulation you must add one of:
#   - A mounted persistent volume (GitHub Actions does not support this
#     natively; requires a self-hosted runner with an attached disk).
#   - An external storage backend: upload fpl.db to S3/GCS/Azure Blob after
#     each run and download it at the start of the next run.
#   - A swap to PostgreSQL or another server-backed store (requires replacing
#     load/ only — orchestration, extract, transform, and schema are backend-agnostic).
#
# OPERATOR CHECKLIST
# The workflow runs as-is with no configuration required.
# Data is not retained between runs (see note above).
#
# To retain data across runs, three changes are needed:
#   1. Choose an external store (Azure Blob, S3, or a hosted database).
#   2. Add a step at the start of this workflow that downloads the
#      database from that store onto the runner.
#   3. Add a step at the end that uploads the updated database back.
#
# To configure paths or secrets:
#   - FPL_DB_PATH — path to the SQLite database (default: ~/.fpl/fpl.db)
#   - FPL_RAW_DIR — path to the raw JSON cache (default: ~/.fpl/raw)
#   - Add secrets via repository Settings → Secrets and variables → Actions

name: Scheduled Ingestion

on:
  schedule:
    # 08:00 UTC daily — adjust for your local timezone awareness.
    - cron: "0 8 * * *"
  workflow_dispatch:
    # Allows manual triggering from the Actions tab or gh CLI:
    #   gh workflow run scheduled_run.yml

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      # Override these via repository secrets or variables if needed.
      # FPL_DB_PATH defaults to ~/.fpl/fpl.db inside the job.
      # FPL_RAW_DIR defaults to ~/.fpl/raw inside the job.
      FPL_DB_PATH: ${{ vars.FPL_DB_PATH || '' }}
      FPL_RAW_DIR: ${{ vars.FPL_RAW_DIR || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      # Run the full ingestion pipeline. The step exits non-zero on any
      # pipeline failure — GitHub marks the run red automatically. No
      # continue-on-error, no silent swallowing of failures.
      - name: Run ingestion
        run: uv run fpl-ingest run

      # Export the _runs audit table to JSON so operators can inspect what
      # was fetched, validated, written, skipped, and any errors — even
      # without access to the ephemeral SQLite file.
      #
      # Runs with if: always() so the artifact is uploaded on both success
      # and failure, giving a post-mortem record for failed runs.
      - name: Export _runs audit table
        if: always()
        run: |
          uv run python - <<'EOF'
          import json, os, sqlite3
          from pathlib import Path

          db_path = os.environ.get("FPL_DB_PATH") or str(Path.home() / ".fpl" / "fpl.db")
          out_path = Path("_runs_audit.json")

          if not Path(db_path).exists():
              print(f"Database not found at {db_path!r}; writing empty audit file.")
              out_path.write_text("[]")
          else:
              conn = sqlite3.connect(db_path)
              conn.row_factory = sqlite3.Row
              try:
                  rows = conn.execute("SELECT * FROM _runs ORDER BY started_at DESC, id DESC").fetchall()
                  out_path.write_text(json.dumps([dict(r) for r in rows], indent=2))
                  print(f"Exported {len(rows)} row(s) from _runs to {out_path}")
              except sqlite3.OperationalError as exc:
                  print(f"Could not query _runs ({exc}); writing empty audit file.")
                  out_path.write_text("[]")
              finally:
                  conn.close()
          EOF

      - name: Upload _runs audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-audit-${{ github.run_id }}
          path: _runs_audit.json
          # Keep audit artifacts for 90 days so operators can compare runs
          # across the season without artifacts expiring between checks.
          retention-days: 90

      # Write a Markdown run summary to the GitHub Actions job summary panel so
      # operators can see the audit table directly in the workflow UI without
      # downloading the artifact. Runs with if: always() to surface a summary
      # even when fpl-ingest run fails.
      - name: Write job summary
        if: always()
        run: |
          uv run python - <<'EOF'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              print("GITHUB_STEP_SUMMARY not set; skipping.")
              raise SystemExit(0)

          audit_file = Path("_runs_audit.json")
          if not audit_file.exists():
              Path(summary_path).open("a").write("## FPL Ingest Run Summary\n\nNo run data available.\n")
              raise SystemExit(0)

          try:
              rows = json.loads(audit_file.read_text())
          except Exception as exc:
              Path(summary_path).open("a").write(f"## FPL Ingest Run Summary\n\nCould not parse audit file: {exc}\n")
              raise SystemExit(0)

          if not rows:
              Path(summary_path).open("a").write("## FPL Ingest Run Summary\n\nNo run data available.\n")
              raise SystemExit(0)

          # Determine last_successful_run_at and staleness
          successful = [r for r in rows if r.get("status") == "SUCCESS"]
          last_successful_at = successful[0]["started_at"] if successful else None
          stale_threshold_hours = 26
          if last_successful_at:
              try:
                  last_dt = datetime.fromisoformat(last_successful_at)
                  age_hours = (datetime.now(timezone.utc) - last_dt).total_seconds() / 3600
                  is_stale = age_hours > stale_threshold_hours
                  age_label = f"{age_hours:.1f}h ago"
              except (ValueError, TypeError):
                  is_stale = False
                  age_label = last_successful_at
          else:
              is_stale = True
              age_label = "never"

          summary_line = (
              f":warning: **WARNING: last successful run was {age_label}**"
              if is_stale
              else ":white_check_mark: **System healthy**"
          )

          headers = ["run timestamp", "stage", "status", "fetched", "validated", "written", "skipped", "errors"]
          col_keys = ["started_at", "stage", "status", "fetched", "validated", "written", "skipped", "errors"]

          def md_row(cells):
              return "| " + " | ".join(str(c) for c in cells) + " |"

          lines = [
              "## FPL Ingest Run Summary",
              "",
              f"Last successful run: **{last_successful_at or 'never'}** ({age_label})",
              "",
              md_row(headers),
              md_row(["---"] * len(headers)),
          ]
          for r in rows:
              lines.append(md_row(r.get(k, "") for k in col_keys))
          lines += ["", summary_line, ""]

          with Path(summary_path).open("a") as f:
              f.write("\n".join(lines))
          print(f"Wrote job summary ({len(rows)} run row(s)).")
          EOF
