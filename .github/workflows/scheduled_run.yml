# Scheduled FPL ingestion workflow.
#
# Runs daily at 08:00 UTC — after FPL typically processes overnight gameweek
# updates. workflow_dispatch allows manual triggering for ad-hoc runs or
# testing without waiting for the cron schedule.
#
# CURRENT MODEL
# Each run writes raw, verbatim captures to local disk under the S3-shaped
# layout `raw/{source}/{endpoint}/{extraction_date}/{run_id}/payload.*`, with
# a per-object metadata.json sidecar and a per-run manifest (see
# docs/architecture/fpl-ingest-strategy.md §A.4/§A.5). There is no database
# and no persistence layer in this repo; GitHub Actions runners are
# ephemeral, so captures written during a run do not survive past it unless
# uploaded to external storage (e.g. as a workflow artifact, or to S3/GCS/
# Azure Blob) by a step added for that purpose.
#
# KNOWN GAP — run freshness/provenance reporting is unresolved follow-up
# work. There is currently no mechanism in this workflow (or elsewhere) that
# reports how stale the last successful run was, or surfaces per-run
# fetch/validate/write counts. A manifest-based replacement is planned but
# not yet built.

name: Scheduled Ingestion

on:
  schedule:
    # 08:00 UTC daily — adjust for your local timezone awareness.
    - cron: "0 8 * * *"
  workflow_dispatch:
    # Allows manual triggering from the Actions tab or gh CLI:
    #   gh workflow run scheduled_run.yml

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      # Override via repository secrets or variables if needed.
      # FPL_RAW_DIR defaults to ~/.fpl/raw inside the job.
      FPL_RAW_DIR: ${{ vars.FPL_RAW_DIR || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      # Run the full ingestion pipeline. The step exits non-zero on any
      # pipeline failure — GitHub marks the run red automatically. No
      # continue-on-error, no silent swallowing of failures.
      - name: Run ingestion
        run: uv run fpl-ingest run

      # Run freshness/provenance reporting (last successful run, staleness,
      # per-run fetch/validate/write counts) is not implemented — see the
      # KNOWN GAP note at the top of this file.
      - name: Write job summary
        if: always()
        run: |
          echo "## FPL Ingest Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run freshness/provenance reporting is not yet implemented (known gap, see workflow header)." >> "$GITHUB_STEP_SUMMARY"
