# Scheduled FPL ingestion workflow — daily cadence.
#
# Runs the full ingestion pipeline twice a day. This is the only scheduled
# full-pipeline workflow (scheduled_run_pre_deadline.yml captures only
# bootstrap-static and fixtures, near deadlines): every run executes all five stages
# (event-status, bootstrap-static, fixtures, event-live, element-summary), and each stage's
# own refetch policy (CLAUDE.md, "Endpoint refetch policy") decides what it
# actually fetches. No consumer needs sub-daily capture: event-live is
# captured once per gameweek after ratification, and ratification is
# detected with a wide margin at this cadence.
#
# Raw captures land in S3 (FPL_STORAGE_BACKEND=s3), authenticated via GitHub
# OIDC federation to an IAM role — no long-lived AWS keys in this repo.

name: Scheduled Ingestion — Daily

on:
  schedule:
    # 07:00 and 19:00 UTC.
    - cron: "0 7,19 * * *"
  workflow_dispatch:
    # Allows manual triggering from the Actions tab or gh CLI:
    #   gh workflow run scheduled_run_daily.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      FPL_STORAGE_BACKEND: s3
      FPL_S3_BUCKET: ${{ vars.FPL_S3_BUCKET || 'fpl-data-safari' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::737634035092:role/github-actions-fpl-ingest
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run ingestion
        # The manifest's trigger field records whether cron or a person started the run.
        run: uv run fpl-ingest run --trigger ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }} --drift-report drift-report.json

      # Hand the finalized manifest's drift to report-drift (#83). The file
      # exists only when a manifest was finalized; a no-op tick uploads nothing.
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
          if-no-files-found: ignore
          retention-days: 7

      # Heartbeat to healthchecks.io (#57). The last step, on every outcome of
      # a scheduled run, and it can never change the job's conclusion.
      # Manual runs do not ping, so they neither raise nor clear an alert.
      # job.status is passed through env, not interpolated into the script.
      - name: Ping healthchecks.io
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 2
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL_DAILY }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/healthchecks_ping.sh "$JOB_STATUS"

  # Surfaces drift: job summary, annotations, one issue per new drift (#83).
  # The only job with issues: write; it holds no AWS credentials (#80 D5).
  # continue-on-error keeps a failure here from turning the workflow red, and
  # the healthchecks.io ping above follows the ingest job alone.
  report-drift:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      # Absent when the run wrote no manifest; report-drift then says so.
      - name: Download drift report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: drift-report
          path: drift-report

      - name: Surface drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run fpl-ingest report-drift --report drift-report/drift-report.json
