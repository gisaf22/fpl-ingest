# Scheduled FPL ingestion workflow — pre-deadline bootstrap-static + fixtures capture.
#
# Captures bootstrap-static and fixtures, shortly before each transfer deadline. The
# daily workflow lands ~07:15 and ~19:15 UTC while deadlines fall between
# 10:00 and 18:30 UTC, so its last capture before a deadline is up to ~11h
# stale; measured over GW3-5 it missed an average of 4 availability changes
# (status / chance_of_playing) for relevant players per deadline.
#
# This restores only the deadline-state capture that scheduled_run_live.yml
# provided until 46d3c19, plus fixtures (#46) so fixture difficulty and
# kickoff times are kept as they stood at each deadline — no match-window
# pulls, no other endpoints. The `pre-deadline` command fetches
# bootstrap-static and, only if the next deadline is within 120 minutes
# (orchestration/pre_deadline.py), writes it and fetches and writes fixtures
# in the same run (payloads, sidecars, one manifest with trigger:
# pre_deadline). Otherwise it exits 0 having written nothing. A failure of
# either endpoint keeps the other and fails the run. There is no marker and
# no state between runs.
#
# Cron runs every 15 minutes at :07/:22/:37/:52 from 08:07 to 19:52 UTC, off
# the busy :00/:30 minutes where GitHub's scheduler is most likely to delay or
# drop a run. With the 120-minute window that serves any deadline between
# 08:07 and 21:52 UTC, with up to eight ticks inside the window. deadline_time is UTC, so the UK clock change
# does not move this window; FPL's 2026-27 deadlines are 10:00-18:30 UTC.

name: Scheduled Ingestion — Pre-deadline

on:
  schedule:
    - cron: "7,22,37,52 8-19 * * *"
  workflow_dispatch:
    # Manual runs are gated the same way unless force is true; outside the
    # window they write nothing. force=true captures now, as trigger: manual.
    #   gh workflow run scheduled_run_pre_deadline.yml -f force=true
    inputs:
      force:
        description: "Skip the deadline gate and capture now (trigger: manual)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FPL_STORAGE_BACKEND: s3
      FPL_S3_BUCKET: ${{ vars.FPL_S3_BUCKET || 'fpl-data-safari' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::737634035092:role/github-actions-fpl-ingest
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Capture bootstrap-static and fixtures if a deadline is near
        run: uv run fpl-ingest pre-deadline --drift-report drift-report.json ${{ inputs.force && '--force' || '' }}

      # Hand the finalized manifest's drift to report-drift (#83). The file
      # exists only when a manifest was finalized; a no-op tick uploads nothing.
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
          if-no-files-found: ignore
          retention-days: 7

      # Heartbeat to healthchecks.io (#57). The last step, on every outcome of
      # a scheduled run, and it can never change the job's conclusion.
      # Manual runs do not ping, so they neither raise nor clear an alert.
      # job.status is passed through env, not interpolated into the script.
      - name: Ping healthchecks.io
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 2
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL_PRE_DEADLINE }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/healthchecks_ping.sh "$JOB_STATUS"

  # Surfaces drift: job summary, annotations, one issue per new drift (#83).
  # The only job with issues: write; it holds no AWS credentials (#80 D5).
  # continue-on-error keeps a failure here from turning the workflow red, and
  # the healthchecks.io ping above follows the capture job alone.
  report-drift:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      # Absent when the run wrote no manifest; report-drift then says so.
      - name: Download drift report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: drift-report
          path: drift-report

      - name: Surface drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run fpl-ingest report-drift --report drift-report/drift-report.json
